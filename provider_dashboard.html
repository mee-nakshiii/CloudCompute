<!DOCTYPE html>
<html>
<head>
    <title>Provider Dashboard</title>
</head>
<body>
    <h2>Add New Hardware</h2>

    <form action="/add_hardware" method="POST">
        <input type="text" name="gpu_model" placeholder="GPU Model" required><br><br>
        <input type="number" name="vram" placeholder="VRAM (GB)" required><br><br>
        <input type="number" step="0.01" name="price" placeholder="Price per Hour" required><br><br>
        <button type="submit">Add Hardware</button>
    </form>

    <br>
    <a href="/marketplace">Back to Marketplace</a>
</body>
</html>
