<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Dashboard - Cloud Compute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white"> <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-lg bg-secondary text-white" style="width: 100%; max-width: 500px;">
            <h2 class="text-center mb-4 border-bottom pb-2">Add New Hardware</h2>
            
            <form action="/add_hardware" method="POST">
                <div class="mb-3">
                    <label class="form-label">GPU Model Name</label>
                    <input type="text" name="gpu_model" class="form-control bg-dark text-white border-0" 
                           placeholder="e.g. NVIDIA RTX 4090" required>
                </div>

                <div class="row mb-4">
                    <div class="col">
                        <label class="form-label">VRAM (GB)</label>
                        <input type="number" name="vram" class="form-control bg-dark text-white border-0" 
                               placeholder="24" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Price / Hour ($)</label>
                        <input type="number" step="0.01" name="price" class="form-control bg-dark text-white border-0" 
                               placeholder="0.50" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">List My Hardware</button>
            </form>

            <div class="text-center mt-4">
                <a href="/marketplace" class="text-info small" style="text-decoration: none;">← Back to Marketplace</a>
            </div>
        </div>
    </div>

</body>
</html>
